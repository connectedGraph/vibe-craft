<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Capsule | AI Enhanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- KaTeX 支持 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="main.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        primaryDark: '#4338ca', // Indigo 700
                        primaryLight: '#e0e7ff', // Indigo 100
                        glassBorder: 'rgba(255, 255, 255, 0.4)',
                        glassSurface: 'rgba(255, 255, 255, 0.65)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'glass-hover': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
                    }
                }
            }
        }
    </script>

</head>
<body class="h-screen w-screen flex text-slate-800 overflow-hidden" id="app-body">

    <div class="ambient-light">
        <div class="blob blob-1 rounded-full mix-blend-multiply"></div>
        <div class="blob blob-2 rounded-full mix-blend-multiply"></div>
        <div class="blob blob-3 rounded-full mix-blend-multiply"></div>
    </div>

    <aside id="left-sidebar" class="w-80 glass-sidebar flex flex-col flex-shrink-0 z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="h-16 flex items-center justify-between px-5 border-b border-white/50">
            <div class="flex items-center gap-3 text-slate-800 font-bold text-lg tracking-tight select-none">
                <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-xl shadow-lg shadow-indigo-500/30 flex items-center justify-center">
                    <i class="ph-bold ph-read-cv-logo text-xl"></i>
                </div>
                Prompt Capsule
            </div>
            <button onclick="window.createNewDoc()" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white/50 hover:bg-white text-primary transition-all shadow-sm border border-white/60" title="New Document">
                <i class="ph-bold ph-plus"></i>
            </button>
        </div>
        
        <div class="p-4 space-y-3 border-b border-white/50">
            <div class="relative group">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors"></i>
                <input type="text" id="sidebar-search" 
                       class="w-full pl-9 pr-3 py-2.5 text-sm bg-white/40 border border-white/60 rounded-xl focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all placeholder-slate-400 backdrop-blur-sm"
                       placeholder="Search topics..."
                       oninput="window.handleSearch()">
            </div>
            
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <select id="sidebar-category" 
                            class="w-full pl-3 pr-8 py-2 text-sm bg-white/40 border border-white/60 rounded-xl focus:ring-2 focus:ring-indigo-100 outline-none appearance-none cursor-pointer text-slate-600 backdrop-blur-sm"
                            onchange="window.handleSearch()">
                        <option value="">All Categories</option>
                        </select>
                    <i class="ph-bold ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                </div>
                <button onclick="window.openCategoryManager()" class="px-2.5 py-1.5 bg-white/40 border border-white/60 rounded-xl text-slate-500 hover:text-primary hover:bg-white transition-all shadow-sm backdrop-blur-sm" title="Manage Categories">
                    <i class="ph-bold ph-gear"></i>
                </button>
            </div>

            <div class="relative w-full">
                <select id="sidebar-tags" 
                        class="w-full pl-8 pr-8 py-2 text-sm bg-white/40 border border-white/60 rounded-xl focus:ring-2 focus:ring-indigo-100 outline-none appearance-none cursor-pointer text-slate-600 backdrop-blur-sm"
                        onchange="window.handleSearch()">
                    <option value="">All Tags</option>
                    </select>
                <i class="ph-bold ph-tag absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                <i class="ph-bold ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
            </div>
        </div>

        <div id="doc-list" class="flex-1 overflow-y-auto p-3 space-y-2">
            </div>

        <div class="p-4 border-t border-white/50 bg-white/30 backdrop-blur-md">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="window.triggerImport()" class="flex items-center justify-center gap-2 px-3 py-2 text-xs font-semibold text-slate-600 bg-white/50 border border-white/60 rounded-lg hover:bg-white hover:shadow-sm transition-all">
                    <i class="ph ph-upload-simple"></i> Import
                </button>
                <button onclick="window.exportBri()" class="flex items-center justify-center gap-2 px-3 py-2 text-xs font-semibold text-slate-600 bg-white/50 border border-white/60 rounded-lg hover:bg-white hover:shadow-sm transition-all">
                    <i class="ph ph-download-simple"></i> Save
                </button>
            </div>
            <input type="file" id="file-input" class="hidden" accept=".bri,.json,.txt" onchange="window.handleFileImport(this)">
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative min-w-0 transition-all duration-500">
        
        <header class="h-16 flex items-center justify-between px-6 glass-header z-30 sticky top-0 transition-all">
            
            <div class="flex-1 flex items-center min-w-0 mr-4 gap-4">
                
                <button onclick="window.toggleSidebar()" class="p-2 -ml-2 text-slate-500 hover:text-primary hover:bg-indigo-50/50 rounded-lg transition-colors" title="Toggle Sidebar">
                    <i class="ph-bold ph-list text-xl"></i>
                </button>

                 <button id="btn-back-global" onclick="window.exitGlobalView()" class="hidden p-2 text-slate-500 hover:text-slate-800 hover:bg-white/50 rounded-full transition-colors" title="Back to Editor">
                    <i class="ph-bold ph-arrow-left text-xl"></i>
                </button>

                <div id="header-doc-controls" class="w-full group">
                    <input type="text" id="doc-title-input" 
                        class="text-xl font-bold text-slate-800 bg-transparent border-none focus:ring-0 focus:outline-none w-full placeholder-slate-300 transition-colors tracking-tight" 
                        placeholder="Untitled Document"
                        oninput="window.updateCurrentDocTitle()">
                    <div id="header-meta-info" class="flex items-center gap-2 text-xs text-slate-400 mt-1">
                        </div>
                </div>

                <div id="header-global-title" class="hidden items-center gap-3 text-lg font-bold text-slate-700">
                    <div class="p-1.5 bg-indigo-100 text-indigo-600 rounded-md">
                        <i class="ph-fill ph-squares-four"></i>
                    </div>
                    Library Explorer
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                
                <div id="doc-mode-toggles" class="flex p-1 bg-slate-100/50 rounded-xl border border-white/60 backdrop-blur-sm">
                    <button id="mode-view" onclick="window.setMode('view')" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-500 hover:text-slate-900" title="Read Mode">
                        <i class="ph-bold ph-book-open"></i> View
                    </button>
                    <button id="mode-note" onclick="window.setMode('note')" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-500 hover:text-slate-900" title="Annotation Mode">
                        <i class="ph-bold ph-highlighter-circle"></i> Note
                    </button>
                    <button id="mode-edit" onclick="window.setMode('edit')" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg transition-all text-slate-500 hover:text-slate-900" title="Content Editor">
                        <i class="ph-bold ph-pencil-simple"></i> Edit
                    </button>
                </div>

                <div class="w-px h-6 bg-slate-200/60"></div>

                <button id="btn-global-view" onclick="window.enterGlobalView()" class="text-slate-500 hover:text-primary hover:bg-white/50 p-2 rounded-lg transition-colors" title="Library View">
                    <i class="ph-bold ph-squares-four text-xl"></i>
                </button>

                <div id="doc-actions" class="flex items-center gap-1">
                    <button onclick="window.toggleZenMode()" class="text-slate-400 hover:text-indigo-600 p-2 rounded-lg hover:bg-white/50 transition-colors" title="Zen Mode (Focus)">
                        <i class="ph-bold ph-corners-out text-xl"></i>
                    </button>
                    <button onclick="window.exportMarkdown()" class="text-slate-400 hover:text-slate-700 p-2 rounded-lg hover:bg-white/50 transition-colors" title="Export Hyperlinked Markdown">
                        <i class="ph-bold ph-file-md text-xl"></i>
                    </button>
                    <button onclick="window.deleteCurrentDoc()" class="text-slate-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50/50 transition-colors" title="Delete Document">
                        <i class="ph-bold ph-trash text-xl"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-hidden relative flex">
            
            <div id="view-global" class="hidden w-full h-full overflow-y-auto p-8 animate-in fade-in duration-300">
                <div class="max-w-7xl mx-auto">
                    <div class="flex justify-between items-end mb-8 border-b border-white/30 pb-4">
                        <div>
                            <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Library</h2>
                            <p class="text-slate-500 text-sm mt-1" id="global-stats-text">Manage your learning journey</p>
                        </div>
                    </div>
                    <div id="global-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20"></div>
                    <div id="global-empty" class="hidden flex flex-col items-center justify-center py-20 text-center">
                        <div class="w-16 h-16 bg-white/50 rounded-full flex items-center justify-center mb-4 text-slate-400 shadow-sm border border-white">
                            <i class="ph ph-magnifying-glass text-3xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-slate-900">No documents found</h3>
                        <button onclick="window.createNewDoc()" class="mt-4 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primaryDark transition shadow-md shadow-indigo-200">Start New Topic</button>
                    </div>
                </div>
            </div>

            <div id="view-editor" class="flex-1 flex flex-col h-full overflow-y-auto hidden">
                <div class="max-w-4xl mx-auto w-full p-8 pb-32 space-y-6">
                    
                    <div class="glass-card p-5 grid grid-cols-2 gap-6">
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Category</label>
                            <div class="relative">
                                <select id="input-category" 
                                    class="w-full p-2.5 bg-white/50 border border-white rounded-lg text-sm text-slate-700 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all appearance-none"
                                    onchange="window.saveContent()">
                                    </select>
                                <i class="ph-bold ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                            </div>
                            <div class="text-[10px] text-slate-400 text-right cursor-pointer hover:text-primary" onclick="window.openCategoryManager()">+ Manage Categories</div>
                        </div>
                        
                        <div class="space-y-1.5">
                             <label class="flex justify-between items-center text-xs font-bold text-slate-400 uppercase tracking-wider">
                                 <span>Tags</span>
                                 <span class="text-[10px] normal-case font-normal text-slate-400">Comma separated</span>
                             </label>
                             <div class="relative">
                                <input type="text" id="input-tags"
                                    class="w-full p-2.5 bg-white/50 border border-white rounded-lg text-sm text-slate-700 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
                                    placeholder="Add tags..."
                                    onchange="window.saveContent()"
                                    onblur="window.saveContent()">
                                <i class="ph-bold ph-tag absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                             </div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="flex items-center gap-2 text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">
                            <i class="ph-bold ph-question text-primary"></i> Question / Context (Markdown)
                        </label>
                        <textarea id="input-question" 
                            class="w-full h-40 p-5 rounded-xl border border-white/60 bg-white/50 backdrop-blur-sm focus:bg-white focus:border-primary focus:ring-4 focus:ring-indigo-100 outline-none resize-none font-mono text-sm leading-relaxed shadow-sm transition-all" 
                            placeholder="# Enter your English text or question here..."
                            oninput="window.saveContent()"></textarea>
                    </div>

                    <div class="space-y-2">
                        <label class="flex items-center gap-2 text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">
                            <i class="ph-bold ph-lightbulb text-green-600"></i> Answer / Analysis (Markdown)
                        </label>
                        <textarea id="input-answer" 
                            class="w-full h-[600px] p-5 rounded-xl border border-white/60 bg-white/50 backdrop-blur-sm focus:bg-white focus:border-primary focus:ring-4 focus:ring-indigo-100 outline-none resize-none font-mono text-sm leading-relaxed shadow-sm transition-all" 
                            placeholder="Enter the detailed analysis, AI explanation, or answer here..."
                            oninput="window.saveContent()"></textarea>
                    </div>
                </div>
            </div>

            <div id="view-preview" class="flex-1 h-full overflow-y-auto hidden scroll-smooth transition-colors duration-300">
                
                <div id="note-mode-banner" class="hidden sticky top-4 mx-auto max-w-fit z-10 bg-amber-100/90 backdrop-blur-md border border-amber-200 px-4 py-2 rounded-full text-center text-xs font-bold text-amber-800 uppercase tracking-widest shadow-lg flex items-center gap-2 animate-in slide-in-from-top-4">
                    <i class="ph-fill ph-pencil-simple"></i> Annotation Mode Active
                </div>

                <div class="max-w-3xl mx-auto py-12 px-8 pb-40 main-content-wrapper">
                    <div id="render-area" class="space-y-8"></div>
                    
                    <div class="mt-20 pt-10 border-t border-slate-200/50 text-center text-slate-400 text-sm">
                        Generated by Bri.Learn
                    </div>
                </div>
            </div>

        </div>

        <button id="selection-toolbar" onclick="window.initiateAnnotation()">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-highlighter-circle text-yellow-400 text-lg"></i> 
                <span>Annotate Text</span>
            </div>
        </button>

    </main>
    
    <button id="zen-exit-btn" onclick="window.toggleZenMode()" class="px-4 py-2 rounded-full text-sm font-bold text-slate-600 hover:text-primary gap-2 items-center transition-all">
        <i class="ph-bold ph-corners-in"></i> Exit Focus
    </button>

    <aside id="annotation-drawer" class="w-[400px] glass-panel flex flex-col flex-shrink-0 transform translate-x-full transition-transform duration-300 absolute right-4 top-4 bottom-4 rounded-2xl z-50 shadow-2xl">
        <div class="h-16 border-b border-white/50 flex items-center justify-between px-5 bg-white/40 rounded-t-2xl">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
                <i class="ph-fill ph-notebook text-primary"></i> Contextual Notes
            </h2>
            <button onclick="window.closeDrawer()" class="text-slate-400 hover:text-slate-700 p-1 rounded-md hover:bg-white/50 transition">
                <i class="ph-bold ph-x text-lg"></i>
            </button>
        </div>
        <div id="annotation-editor-panel" class="p-5 border-b border-white/50 hidden bg-indigo-50/50 backdrop-blur-sm">
            <div class="flex justify-between items-center mb-3">
                <span id="editor-mode-label" class="text-xs font-bold text-primary uppercase tracking-wider">Adding Note</span>
            </div>
            <div id="selected-text-display" class="text-sm font-medium text-slate-800 bg-white/80 p-3 rounded-lg border border-indigo-100 mb-3 shadow-sm italic border-l-4 border-l-primary"></div>
            <textarea id="annotation-input" rows="6" class="w-full p-3 text-sm bg-white/80 border border-white/60 rounded-lg focus:ring-2 focus:ring-indigo-200 focus:border-primary outline-none transition-shadow mb-3 resize-none font-mono" placeholder="Context-based explanation (Markdown supported)..."></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="window.cancelAnnotation()" class="px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-white rounded-md transition border border-transparent hover:border-slate-200">Cancel</button>
                <button onclick="window.saveAnnotation()" class="px-3 py-1.5 text-xs font-medium bg-primary text-white rounded-md hover:bg-primaryDark shadow-lg shadow-indigo-200 transition" id="save-anno-btn">Save Note</button>
            </div>
        </div>
        <div id="annotation-list" class="flex-1 overflow-y-auto p-5 space-y-4 rounded-b-2xl"></div>
    </aside>

    <div id="category-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center">
        <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm transition-opacity" onclick="window.closeCategoryManager()"></div>
        <div class="bg-white/90 backdrop-blur-xl border border-white rounded-2xl shadow-2xl w-full max-w-md relative z-10 overflow-hidden transform transition-all scale-100 animate-in zoom-in-95">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white/50">
                <h3 class="font-bold text-slate-800 text-lg">Manage Categories</h3>
                <button onclick="window.closeCategoryManager()" class="text-slate-400 hover:text-slate-600"><i class="ph-bold ph-x"></i></button>
            </div>
            <div class="p-6">
                <div class="flex gap-2 mb-6">
                    <input type="text" id="new-cat-input" class="flex-1 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="New Category Name...">
                    <button onclick="window.addCategory()" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primaryDark text-sm font-medium transition shadow-sm">Add</button>
                </div>
                <div class="space-y-2 max-h-[300px] overflow-y-auto pr-1" id="category-manager-list"></div>
            </div>
            <div class="px-6 py-3 bg-slate-50 text-xs text-slate-400 text-center border-t border-slate-100">
                Deleting a category moves its files to "General"
            </div>
        </div>
    </div>

    <script>
        // --- DATA STRUCTURE & CONFIG ---
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);
        const STORAGE_KEY = 'bri_app_pro_v2'; // Version bump for fresh look
        const DEFAULT_CAT = 'General';

        let appState = {
            docs: [],
            activeDocId: null,
            categories: ['General', 'Vocabulary', 'Grammar', 'Reading'], 
            ui: {
                mode: 'view', 
                globalMode: false,
                drawerOpen: false,
                sidebarOpen: true, 
                editingAnnotationId: null,
                searchQuery: '',
                searchCategory: '',
                searchTag: '', 
                deepSearch: false,
                zenMode: false // New
            }
        };

        let tempSelection = { text: '', range: null };

        // --- APP INITIALIZATION ---
        
        function initApp() {
            marked.use({ breaks: true, gfm: true });
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    appState = { ...appState, ...parsed }; 
                    if (!appState.categories || appState.categories.length === 0) {
                        const extracted = new Set(appState.docs.map(d => d.category || DEFAULT_CAT));
                        extracted.add(DEFAULT_CAT);
                        appState.categories = Array.from(extracted);
                    }
                    appState.docs.forEach(d => { if(!d.tags) d.tags = []; });
                    appState.ui.mode = 'view';
                    appState.ui.sidebarOpen = true; 
                    appState.ui.zenMode = false;
                } catch (e) { console.error("Load error", e); }
            } else {
                createMockData();
            }

            appState.ui.drawerOpen = false;
            appState.ui.editingAnnotationId = null;
            appState.ui.globalMode = false;
            
            if (appState.docs.length > 0) {
                if (!appState.docs.find(d => d.id === appState.activeDocId)) appState.activeDocId = appState.docs[0].id;
                window.loadDoc(appState.activeDocId);
            } else {
                window.createNewDoc();
            }
            
            window.updateCategoryDropdowns();
            window.updateTagDropdown(); 
            window.renderDocList();
            window.setMode('view'); 
        }

        window.addEventListener('DOMContentLoaded', initApp);

        function createMockData() {
            const mockDoc = {
                id: generateId(),
                title: 'Welcome to Bri.Learn',
                category: 'General',
                tags: ['guide', 'glassmorphism'], 
                question: '### How to use this app?\n\nThis is a **concept-first** learning tool. You write a question or paste text on top, and write your analysis below.',
                answer: 'In the **Note** mode, you can select any text to add **annotations**. \n\nTry selecting the word "annotations" above! \n\n> This new design uses "Glassmorphism" to provide a calm, focused environment for deep learning.',
                annotations: [
                    { id: generateId(), text: 'annotations', note: 'Notes added to specific words for context.'}
                ],
                updatedAt: Date.now()
            };
            appState.docs = [mockDoc];
            appState.categories = ['General', 'Vocabulary', 'Grammar'];
            window.persistState();
        }

        window.persistState = function() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        // --- NEW: ZEN MODE ---
        window.toggleZenMode = function() {
            appState.ui.zenMode = !appState.ui.zenMode;
            const body = document.body;
            if(appState.ui.zenMode) {
                body.classList.add('zen-mode');
                // Force sidebar closed logic visually
                if(appState.ui.sidebarOpen) document.getElementById('app-body').classList.add('sidebar-closed');
            } else {
                body.classList.remove('zen-mode');
                if(appState.ui.sidebarOpen) document.getElementById('app-body').classList.remove('sidebar-closed');
            }
        }

        // --- SIDEBAR TOGGLE ---
        window.toggleSidebar = function() {
            const body = document.getElementById('app-body');
            appState.ui.sidebarOpen = !appState.ui.sidebarOpen;
            if(appState.ui.sidebarOpen) {
                body.classList.remove('sidebar-closed');
            } else {
                body.classList.add('sidebar-closed');
            }
        }

        // --- TAG & FILTER LOGIC ---
        window.updateTagDropdown = function() {
            const allTags = new Set();
            appState.docs.forEach(doc => {
                if(doc.tags && Array.isArray(doc.tags)) {
                    doc.tags.forEach(t => allTags.add(t));
                }
            });
            const sortedTags = Array.from(allTags).sort();
            
            const select = document.getElementById('sidebar-tags');
            const current = select.value;
            select.innerHTML = '<option value="">All Tags</option>' + 
                sortedTags.map(t => `<option value="${t}">${t}</option>`).join('');
            
            if(sortedTags.includes(current)) select.value = current;
        }

        window.updateCategoryDropdowns = function() {
            const sidebarSelect = document.getElementById('sidebar-category');
            const currentFilter = sidebarSelect.value;
            sidebarSelect.innerHTML = '<option value="">All Categories</option>' + 
                appState.categories.map(c => `<option value="${c}">${c}</option>`).join('');
            if (appState.categories.includes(currentFilter)) sidebarSelect.value = currentFilter;

            const editorSelect = document.getElementById('input-category');
            if(editorSelect) {
                editorSelect.innerHTML = appState.categories.map(c => `<option value="${c}">${c}</option>`).join('');
                const doc = appState.docs.find(d => d.id === appState.activeDocId);
                if(doc && appState.categories.includes(doc.category)) {
                    editorSelect.value = doc.category;
                }
            }
        }

        window.openCategoryManager = function() {
            const modal = document.getElementById('category-modal');
            const list = document.getElementById('category-manager-list');
            modal.classList.remove('hidden');
            
            const renderManagerList = () => {
                list.innerHTML = appState.categories.map(cat => `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-lg group hover:border-indigo-200 transition-colors">
                        <div class="flex-1 font-medium text-slate-700 text-sm">
                            <input type="text" value="${cat}" 
                                class="bg-transparent border-none focus:ring-0 w-full p-0 font-medium text-slate-700 disabled:text-slate-500"
                                id="cat-edit-${cat}"
                                disabled
                                onblur="window.confirmRenameCategory('${cat}', this.value)"
                                onkeydown="if(event.key==='Enter') this.blur()">
                        </div>
                        <div class="flex gap-2 opacity-100 transition-opacity">
                            <button onclick="window.enableRename('${cat}')" class="p-1.5 text-slate-400 hover:text-primary rounded-md hover:bg-white shadow-sm" title="Rename">
                                <i class="ph-bold ph-pencil-simple"></i>
                            </button>
                            ${cat !== 'General' ? `
                            <button onclick="window.deleteCategory('${cat}')" class="p-1.5 text-slate-400 hover:text-red-500 rounded-md hover:bg-white shadow-sm" title="Delete">
                                <i class="ph-bold ph-trash"></i>
                            </button>` : ''}
                        </div>
                    </div>
                `).join('');
            };
            renderManagerList();
        }

        window.closeCategoryManager = function() { document.getElementById('category-modal').classList.add('hidden'); }

        window.addCategory = function() {
            const input = document.getElementById('new-cat-input');
            const val = input.value.trim();
            if (val && !appState.categories.includes(val)) {
                appState.categories.push(val);
                appState.categories.sort();
                input.value = '';
                window.openCategoryManager(); 
                window.updateCategoryDropdowns();
                window.persistState();
            }
        }

        window.enableRename = function(catName) {
            const input = document.getElementById(`cat-edit-${catName}`);
            input.disabled = false;
            input.focus();
            input.parentElement.parentElement.classList.add('ring-2', 'ring-primary', 'bg-white');
        }

        window.confirmRenameCategory = function(oldName, newName) {
            newName = newName.trim();
            if (!newName || newName === oldName) { window.openCategoryManager(); return; }
            if (appState.categories.includes(newName)) { alert('Category name already exists!'); window.openCategoryManager(); return; }
            const idx = appState.categories.indexOf(oldName);
            if (idx !== -1) appState.categories[idx] = newName;
            appState.docs.forEach(doc => { if (doc.category === oldName) doc.category = newName; });
            if (appState.ui.searchCategory === oldName) appState.ui.searchCategory = newName;
            appState.categories.sort();
            window.persistState();
            window.updateCategoryDropdowns();
            window.renderDocList();
            window.renderPreview(); 
            window.openCategoryManager(); 
        }

        window.deleteCategory = function(catName) {
            if (catName === 'General') return;
            if (!confirm(`Delete category "${catName}"? \n\nFiles in this category will be moved to "General".`)) return;
            appState.docs.forEach(doc => { if (doc.category === catName) doc.category = 'General'; });
            appState.categories = appState.categories.filter(c => c !== catName);
            if (appState.ui.searchCategory === catName) {
                appState.ui.searchCategory = '';
                document.getElementById('sidebar-category').value = '';
            }
            window.persistState();
            window.updateCategoryDropdowns();
            window.renderDocList();
            window.openCategoryManager();
        }

        window.createNewDoc = function() {
            const newDoc = {
                id: generateId(),
                title: 'New Note',
                category: 'General',
                tags: [],
                question: '',
                answer: '',
                annotations: [],
                updatedAt: Date.now()
            };
            appState.docs.unshift(newDoc);
            if(appState.ui.globalMode) window.exitGlobalView();
            window.loadDoc(newDoc.id);
            window.setMode('edit');
            window.renderDocList();
            window.persistState();
            setTimeout(() => {
                const titleInput = document.getElementById('doc-title-input');
                if(titleInput) titleInput.select();
            }, 100);
        }

        window.loadDoc = function(id) {
            appState.activeDocId = id;
            const doc = appState.docs.find(d => d.id === id);
            if (!doc) return;
            if (!appState.categories.includes(doc.category)) doc.category = 'General';
            if (!doc.tags) doc.tags = []; 

            const titleIn = document.getElementById('doc-title-input');
            const qIn = document.getElementById('input-question');
            const aIn = document.getElementById('input-answer');
            const tagsIn = document.getElementById('input-tags');
            
            if(titleIn) titleIn.value = doc.title;
            if(qIn) qIn.value = doc.question;
            if(aIn) aIn.value = doc.answer;
            if(tagsIn) tagsIn.value = doc.tags.join(', ');
            
            const catSelect = document.getElementById('input-category');
            if(catSelect) catSelect.value = doc.category;

            window.renderDocList();
            if (appState.ui.mode === 'view' || appState.ui.mode === 'note') {
                window.renderPreview();
                window.renderAnnotationsSidebar();
            }
        }

        window.saveContent = function() {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if (!doc) return;

            doc.question = document.getElementById('input-question').value;
            doc.answer = document.getElementById('input-answer').value;
            doc.category = document.getElementById('input-category').value;
            
            const tagsVal = document.getElementById('input-tags').value;
            doc.tags = tagsVal.split(',')
                             .map(t => t.trim())
                             .filter(t => t.length > 0);
            
            doc.updatedAt = Date.now();
            
            window.updateTagDropdown(); 
            window.renderDocList();
            window.persistState();
        }

        window.updateCurrentDocTitle = function() {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if (!doc) return;
            doc.title = document.getElementById('doc-title-input').value || "Untitled";
            doc.updatedAt = Date.now();
            window.renderDocList();
            window.persistState();
        }

        window.deleteCurrentDoc = function() {
            if(!confirm("Are you sure you want to delete this document?")) return;
            appState.docs = appState.docs.filter(d => d.id !== appState.activeDocId);
            if(appState.docs.length > 0) window.loadDoc(appState.docs[0].id);
            else window.createNewDoc();
            window.updateTagDropdown();
            window.persistState();
        }

        window.setMode = function(mode) {
            appState.ui.mode = mode;
            const btnView = document.getElementById('mode-view');
            const btnNote = document.getElementById('mode-note');
            const btnEdit = document.getElementById('mode-edit');
            const viewEditor = document.getElementById('view-editor');
            const viewPreview = document.getElementById('view-preview');

            btnView.className = `${btnBase} ${mode === 'view' ? btnActive : btnInactive}`;
            btnNote.className = `${btnBase} ${mode === 'note' ? btnActive : btnInactive}`;
            btnEdit.className = `${btnBase} ${mode === 'edit' ? btnActive : btnInactive}`;

                renderArea.className = `space-y-8 ${mode === 'view' ? 'mode-view' : 'mode-note'}`;

        window.handleSearch = function() {
            appState.ui.searchQuery = document.getElementById('sidebar-search').value.toLowerCase();
            appState.ui.searchCategory = document.getElementById('sidebar-category').value;
            appState.ui.searchTag = document.getElementById('sidebar-tags').value; 
            
            window.renderDocList();
            if(appState.ui.globalMode) window.renderGlobalGrid();
        }

        window.getFilteredDocs = function() {
            const { searchQuery, searchCategory, searchTag, deepSearch } = appState.ui;
            return appState.docs.filter(doc => {
                if (searchCategory && doc.category !== searchCategory) return false;
                if (searchTag && (!doc.tags || !doc.tags.includes(searchTag))) return false; 
                
                if (!searchQuery) return true;
                const titleMatch = doc.title.toLowerCase().includes(searchQuery);
                if (titleMatch) return true;
                if (deepSearch) {
                    return (doc.question || '').toLowerCase().includes(searchQuery) || 
                           (doc.answer || '').toLowerCase().includes(searchQuery);
                }
                return false;
            });
        }

        window.renderDocList = function() {

            const docs = window.getFilteredDocs();
            
            if (docs.length === 0) {
                list.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">No results found.</div>`;
                return;
            }

            list.innerHTML = docs.map(doc => {
                const isActive = appState.activeDocId === doc.id && !appState.ui.globalMode;
                const tagsHtml = doc.tags && doc.tags.length > 0

                    : '';

                return `
                <div onclick="window.loadDoc('${doc.id}')" 
                     class="group p-3 rounded-xl cursor-pointer transition-all border ${isActive ? 'bg-white shadow-sm border-white ring-1 ring-indigo-100' : 'bg-transparent border-transparent hover:bg-white/40 hover:border-white/40'}">

        window.openDocFromGlobal = function(id) { window.loadDoc(id); window.exitGlobalView(); }
        
        window.renderPreview = function() {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if(!doc) return;

            // Header Meta Info Logic
            const tagsHtml = doc.tags && doc.tags.length > 0 
                ? doc.tags.map(t => `<span class="text-[10px] text-slate-500 px-1.5 py-0.5 bg-white/50 border border-white rounded-md">#${t}</span>`).join('') 
                : '';

            const metaDiv = document.getElementById('header-meta-info');
            metaDiv.innerHTML = `
                <span class="px-2 py-0.5 rounded bg-slate-100/50 text-slate-600 border border-slate-200/50">${doc.category}</span>
                <div class="flex gap-1">${tagsHtml}</div>
                <span class="w-1 h-1 bg-slate-300 rounded-full"></span>
                <span>Last edited ${new Date(doc.updatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            `;

            const renderArea = document.getElementById('render-area');
            renderArea.className = `space-y-8 ${appState.ui.mode === 'view' ? 'mode-view' : 'mode-note'}`;
            
            // --- 直接渲染方法 ---
            const renderWithLatexAndAnnotations = (markdown, annotations) => {
                if (!markdown) return '';
                
                // 1. 先渲染 Markdown（不处理 LaTeX）
                let html = marked.parse(markdown);
                
                // 2. 使用 KaTeX 渲染所有数学公式
                // 先处理显示模式 $$...$$
                html = html.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
                    try {
                        return katex.renderToString(formula.trim(), {
                            displayMode: true,
                            throwOnError: false
                        });
                    } catch (e) {
                        return `<span class="text-red-500">$${formula}$$</span>`;
                    }
                });
                
                // 再处理行内模式 $...$
                html = html.replace(/\$([^$]*?)\$/g, (match, formula) => {
                    // 跳过已经被处理的 $$ 情况
                    if (match.includes('class="katex"')) return match;
                    try {
                        return katex.renderToString(formula.trim(), {
                            displayMode: false,
                            throwOnError: false
                        });
                    } catch (e) {
                        return `<span class="text-red-500">$${formula}$</span>`;
                    }
                });
                
                // 3. 应用标注高亮（在公式渲染之后）
                const sortedAnnotations = [...annotations].sort((a,b) => b.text.length - a.text.length);
                
                sortedAnnotations.forEach(anno => {
                    const text = anno.text;
                    // 只在非公式文本中查找和替换
                    const parts = html.split(/(<[^>]+>)/g);
                    for (let i = 0; i < parts.length; i++) {
                        // 跳过 HTML 标签部分
                        if (parts[i].startsWith('<') && parts[i].endsWith('>')) continue;
                        
                        // 在文本部分中查找
                        if (parts[i].includes(text)) {
                            parts[i] = parts[i].replace(
                                new RegExp(text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'),
                                `<span class="bri-highlight" onclick="window.handleAnnotationClick('${anno.id}', event)" data-id="${anno.id}">${text}</span>`
                            );
                        }
                    }
                    html = parts.join('');
                });
                
                return html;
            };

            // 处理问题和答案内容
            const qHtml = renderWithLatexAndAnnotations(doc.question || '', doc.annotations);
            const aHtml = renderWithLatexAndAnnotations(doc.answer || '', doc.annotations);

            // --- Render to DOM ---
            renderArea.innerHTML = `
                <div class="relative group glass-card p-8 transition-all hover:shadow-glass-hover">
                    <div class="absolute -left-3 top-8 bottom-8 w-1.5 bg-gradient-to-b from-indigo-400 to-purple-400 rounded-full opacity-60"></div>
                    <div class="flex items-center gap-3 mb-6">
                        <div class="p-1.5 bg-indigo-100 text-indigo-600 rounded-lg"><i class="ph-bold ph-question"></i></div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Context / Question</h2>
                    </div>
                    <div id="render-q" class="prose prose-slate prose-lg max-w-none text-slate-800 selection:bg-indigo-100 select-text-area">${qHtml || '<p class="italic text-slate-400">No context provided.</p>'}</div>
                </div>
                
                <div class="relative group glass-card p-8 mt-8 border-t-4 border-t-emerald-400/30 transition-all hover:shadow-glass-hover">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="p-1.5 bg-emerald-100 text-emerald-600 rounded-lg"><i class="ph-bold ph-lightbulb"></i></div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Analysis / Answer</h2>
                    </div>
                    <div id="render-a" class="prose prose-slate prose-lg max-w-none text-slate-800 selection:bg-emerald-100 select-text-area">${aHtml || '<p class="italic text-slate-400">No analysis provided.</p>'}</div>
                </div>
            `;

            if (appState.ui.mode === 'note') window.attachSelectionListener();
        }
        window.attachSelectionListener = function() {
            const container = document.getElementById('view-preview');
            const toolbar = document.getElementById('selection-toolbar');
            if (appState.ui.mode !== 'note') return;
            const handleSelect = () => {
                const selection = window.getSelection();
                const text = selection.toString().trim();
                if (text.length > 0 && !selection.isCollapsed) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    toolbar.style.top = `${rect.top - 60}px`; 
                    toolbar.style.left = `${rect.left + (rect.width / 2)}px`;
                    toolbar.style.display = 'block';
                    tempSelection.text = text;
                } else {
                    toolbar.style.display = 'none';
                }
            };
            container.onmouseup = handleSelect;
            container.onkeyup = handleSelect; 
        }

        window.initiateAnnotation = function() {
            document.getElementById('selection-toolbar').style.display = 'none';
            appState.ui.editingAnnotationId = null;
            window.openDrawer(true);
        }

        window.handleAnnotationClick = function(id, event) {
            if(event) event.stopPropagation();
            document.querySelectorAll('.bri-highlight').forEach(el => el.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
            if (appState.ui.mode === 'view') { window.openDrawer(false); window.scrollToNoteCard(id); }
            else if (appState.ui.mode === 'note') { window.editAnnotationStart(id); }
        }

        window.scrollToNoteCard = function(id) {
            setTimeout(() => {
                const el = document.getElementById(`sidebar-anno-${id}`);
                if(el) {
                    // Open drawer first
                    const drawer = document.getElementById('annotation-drawer');
                    drawer.classList.remove('translate-x-full');
                    appState.ui.drawerOpen = true;

                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('ring-2', 'ring-primary', 'bg-indigo-50');
                    setTimeout(() => el.classList.remove('ring-2', 'ring-primary', 'bg-indigo-50'), 1500);
                }
            }, 100);
        }

        window.saveAnnotation = function() {
            const content = document.getElementById('annotation-input').value;
            if(!content) return;
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if(appState.ui.editingAnnotationId) {
                const idx = doc.annotations.findIndex(a => a.id === appState.ui.editingAnnotationId);
                if(idx !== -1) doc.annotations[idx].note = content;
            } else {
                doc.annotations.push({ id: generateId(), text: tempSelection.text, note: content });
            }
            window.cancelAnnotation();
            window.renderPreview();
            window.renderAnnotationsSidebar();
            window.persistState();
        }

        window.deleteAnnotation = function(id) {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            doc.annotations = doc.annotations.filter(a => a.id !== id);
            if(appState.ui.editingAnnotationId === id) window.cancelAnnotation();
            window.renderPreview();
            window.renderAnnotationsSidebar();
            window.persistState();
        }

        window.cancelAnnotation = function() {
            appState.ui.editingAnnotationId = null;
            document.getElementById('annotation-editor-panel').classList.add('hidden');
            document.getElementById('annotation-input').value = '';
        }

        window.openDrawer = function(showEditorPanel) {
            const drawer = document.getElementById('annotation-drawer');
            drawer.classList.remove('translate-x-full');
            appState.ui.drawerOpen = true;
            const panel = document.getElementById('annotation-editor-panel');
            if(showEditorPanel && appState.ui.mode === 'note') {
                panel.classList.remove('hidden');
                document.getElementById('selected-text-display').textContent = tempSelection.text;
                document.getElementById('annotation-input').focus();
            } else { panel.classList.add('hidden'); }
        }

        window.closeDrawer = function() {
            document.getElementById('annotation-drawer').classList.add('translate-x-full');
            appState.ui.drawerOpen = false;
            document.querySelectorAll('.bri-highlight').forEach(el => el.classList.remove('active'));
            window.cancelAnnotation();
        }

        window.renderAnnotationsSidebar = function() {
            const list = document.getElementById('annotation-list');
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if(!doc || doc.annotations.length === 0) {
                if(appState.ui.mode === 'note' && document.getElementById('annotation-editor-panel').classList.contains('hidden')) {
                    list.innerHTML = `<div class="flex flex-col items-center justify-center text-center mt-12 text-slate-400"><i class="ph ph-highlighter-circle text-4xl mb-2 opacity-50"></i><p class="text-sm">Select text to add notes.</p></div>`;
                } else if (appState.ui.mode === 'view') {
                    list.innerHTML = `<div class="flex flex-col items-center justify-center text-center mt-12 text-slate-400"><p class="text-sm italic">No notes found.</p></div>`;
                } else { list.innerHTML = ''; }
                return;
            }
            list.innerHTML = doc.annotations.map(anno => {
            const showControls = appState.ui.mode === 'note';
            return `
            <div id="sidebar-anno-${anno.id}" class="bg-white/80 backdrop-blur-sm border border-white/60 rounded-xl p-4 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all group">
                <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold text-amber-800 bg-amber-100/80 px-2 py-0.5 rounded border border-amber-200 truncate max-w-[180px]">${anno.text}</span>
                ${showControls ? `<div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity"><button onclick="window.editAnnotationStart('${anno.id}')" class="p-1 text-slate-400 hover:text-primary"><i class="ph-bold ph-pencil-simple"></i></button><button onclick="window.deleteAnnotation('${anno.id}')" class="p-1 text-slate-400 hover:text-red-500"><i class="ph-bold ph-trash"></i></button></div>` : ''}
                </div>
                <div class="text-sm text-slate-600 leading-relaxed prose prose-sm">${marked.parse(anno.note)}</div>
            </div>
            `;
            }).join('');
        }

        window.editAnnotationStart = function(id) {
            if (appState.ui.mode !== 'note') return;
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            const anno = doc.annotations.find(a => a.id === id);
            if(!anno) return;
            appState.ui.editingAnnotationId = id;
            tempSelection.text = anno.text;
            document.getElementById('annotation-input').value = anno.note;
            document.getElementById('editor-mode-label').textContent = "Editing Note";
            document.getElementById('save-anno-btn').textContent = "Update";
            window.openDrawer(true);
        }

        window.exportBri = function() {
            const dataStr = JSON.stringify(appState, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bri-library-v2-${new Date().toISOString().slice(0,10)}.bri`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.triggerImport = function() { document.getElementById('file-input').click(); }

        window.handleFileImport = function(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const loaded = JSON.parse(e.target.result);
                    if(loaded.docs) {
                        appState = loaded;
                        window.updateCategoryDropdowns();
                        window.renderDocList();
                        window.loadDoc(appState.docs[0].id);
                        window.persistState();
                        alert("Library imported successfully.");
                    }
                } catch(err) { alert("Invalid file."); }
            };
            reader.readAsText(file);
            input.value = '';
        }

        window.exportMarkdown = function() {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if (!doc) return;
            let mdContent = `# ${doc.title}\n\n> Generated by Bri.Learn on ${new Date().toLocaleDateString()}\n\n`;
            let qText = doc.question; let aText = doc.answer;
            doc.annotations.forEach((anno, index) => {
                const anchorId = `glossary-${index}`; const textId = `text-${index}`;
                const replacement = `<a id="${textId}" href="#${anchorId}" style="text-decoration:none; border-bottom:1px dashed #666; background-color: #fffbeb;">${anno.text}</a>`;
                const regex = new RegExp(anno.text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'); 
                qText = qText.replace(regex, replacement); aText = aText.replace(regex, replacement);
            });
            mdContent += `## Question / Context\n\n${qText}\n\n---\n\n## Answer / Analysis\n\n${aText}\n\n`;
            if(doc.annotations.length > 0) {
                mdContent += `---\n\n## 📝 Contextual Glossary\n\n`;
                doc.annotations.forEach((anno, index) => {
                     const anchorId = `glossary-${index}`; const textId = `text-${index}`;
                     mdContent += `<div id="${anchorId}" style="margin-bottom: 10px; padding: 10px; border: 1px solid #eee; border-radius: 6px;">\n  <strong>${anno.text}</strong>: ${anno.note} <a href="#${textId}">↩ Back</a>\n</div>\n\n`;
                });
            }
            const blob = new Blob([mdContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${doc.title.replace(/\s+/g, '_')}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
    
</body>
</html>

// ===== SOUND ENGINE =====
const playSound = (type = 'click') => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'click') {
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.start(); osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
            osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.45);
            osc.start(); osc.stop(ctx.currentTime + 0.5);
        } else if (type === 'tick') {
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            gain.gain.setValueAtTime(0.02, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.02);
            osc.start(); osc.stop(ctx.currentTime + 0.02);
        } else if (type === 'complete') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.4);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
        }
    } catch (e) { console.log('Audio error:', e); }
};

    localStorage.setItem('aura_lang', currentLang);

function loadState() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
        try { state = { ...state, ...JSON.parse(stored) }; } catch(e) { console.error(e); }
    }
    if (!state.logTopics || state.logTopics.length === 0) {
        state.logTopics = ['工作', '生活', '学习', '反思'];
    }
    if (!state.currentLogTopic) state.currentLogTopic = state.logTopics[0];
    const today = getTodayString();
    if (!state.dailyLogs[today]) {
        state.dailyLogs[today] = { focus: 5, energy: 5, mood: 5, entries: [] };
    }
}
function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const el = document.getElementById('save-status-text');
    if (el) { el.textContent = t('saving'); setTimeout(() => { el.textContent = t('saveOk'); }, 500); }
}
function getTodayString() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ===== SIDEBAR =====
function toggleSidebar() {
    sidebarCollapsed = !sidebarCollapsed;
    applySidebarState();
}
function applySidebarState() {
    const aside = document.getElementById('sidebar');
    const icon = document.getElementById('sidebar-toggle-icon');
    const texts = document.querySelectorAll('.sidebar-text');
    const footer = document.getElementById('sidebar-footer');
    if (sidebarCollapsed) {
        aside.style.width = '60px';
        aside.style.minWidth = '60px';
        texts.forEach(el => el.style.display = 'none');
        if (footer) footer.style.display = 'none';
        icon.className = 'fa-solid fa-chevron-right';
        document.querySelectorAll('#sidebar-nav button').forEach(btn => {
            btn.style.justifyContent = 'center';
            btn.style.paddingLeft = '0';
            btn.style.paddingRight = '0';
        });
    } else {
        aside.style.width = '256px';
        aside.style.minWidth = '256px';
        texts.forEach(el => el.style.display = '');
        if (footer) footer.style.display = '';
        icon.className = 'fa-solid fa-chevron-left';
        document.querySelectorAll('#sidebar-nav button').forEach(btn => {
            btn.style.justifyContent = '';
            btn.style.paddingLeft = '';
            btn.style.paddingRight = '';
        });
    }
}
// ===== LANGUAGE APPLICATION =====
function applyLang() {
    document.getElementById('lang-toggle').textContent = t('langBtn');
    document.getElementById('save-status-text').textContent = t('saveOk');
    document.getElementById('hint-switch').textContent = t('hintSwitch');
    document.getElementById('hint-sidebar').textContent = t('hintSidebar');
    document.getElementById('hint-log').textContent = t('hintLog');
    document.getElementById('hint-submit').textContent = t('hintSubmit');
    document.getElementById('sidebar-subtitle').textContent = t('sidebarSubtitle');
    // Nav labels
    const navLabels = t('navTabs');
    for (let i = 0; i < 4; i++) {
        const span = document.querySelector(`[data-nav="${i}"]`);
        if (span) span.textContent = navLabels[i];
    }
    document.getElementById('current-tab-indicator').textContent = navLabels[currentMainTab];
    renderSubTabs();
}

// ===== TAB SWITCHING =====
function switchMainTab(index) {
    playSound('click');
    currentMainTab = index;
    currentSubTab = 0;
    updateNavHighlight();
    applyLang();
    renderCurrentView();
}
function switchSubTab(index) {
    playSound('click');
    currentSubTab = index;
    renderSubTabs();
    renderCurrentView();
}
function updateNavHighlight() {
    for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`nav-${i}`);
        if (i === currentMainTab) {
            btn.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium smooth-transition text-neutral-800 bg-neutral-100";
        } else {
            btn.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium smooth-transition text-neutral-500 hover:text-neutral-800 hover:bg-neutral-50";
        }
    }
}
function renderSubTabs() {
    const container = document.getElementById('sub-tabs-container');
    const subs = t('subTabs')[currentMainTab];
    let html = '';
    subs.forEach((label, i) => {
        const cls = i === currentSubTab ? 'bg-neutral-800 text-white' : 'bg-neutral-100 text-neutral-600 hover:bg-neutral-200';
        html += `<button onclick="switchSubTab(${i})" class="px-3 py-1 rounded-full text-xs font-medium smooth-transition ${cls}">${label}</button>`;
    });

}

// ===== MAIN RENDER DISPATCHER =====
function renderCurrentView() {
    const content = document.getElementById('main-content');
    if (currentMainTab === 0 && currentSubTab === 0) content.innerHTML = renderFocusView();
    else if (currentMainTab === 0 && currentSubTab === 1) content.innerHTML = renderClipboardView();
    else if (currentMainTab === 1 && currentSubTab === 0) content.innerHTML = renderPulseView();
    else if (currentMainTab === 1 && currentSubTab === 1) content.innerHTML = renderLogEntriesView();
    else if (currentMainTab === 2 && currentSubTab === 0) content.innerHTML = renderPlannerSlot(1);
    else if (currentMainTab === 2 && currentSubTab === 1) content.innerHTML = renderPlannerSlot(2);
    else if (currentMainTab === 2 && currentSubTab === 2) content.innerHTML = renderTimelineView();
    else if (currentMainTab === 3 && currentSubTab === 0) content.innerHTML = renderInboxView();
    else if (currentMainTab === 3 && currentSubTab === 1) content.innerHTML = renderPitsView();
    // Post-render hooks
    postRender();
}
function postRender() {
    if (currentMainTab === 2 && currentSubTab < 2) {
        const slotNum = currentSubTab === 0 ? 1 : 2;
        renderPlannerMarkdownDOM(slotNum);
    }
}
// ===== POMODORO / FOCUS VIEW =====
function renderFocusView() {

    return `
    <div class="space-y-8">
        <div>
            <h2 class="text-2xl font-serif font-bold text-neutral-800 tracking-tight">${t('greeting')}</h2>

        </div>

                <div class="flex items-center space-x-1 text-xs text-amber-600 font-medium">
                    <i class="fa-solid fa-fire"></i>
                    <span>${t('streakLabel')}: ${state.pomodoro.streak} ${t('streakUnit')}</span>
                </div>
            </div>

                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="88" cy="88" r="80" stroke="#FAF9F6" stroke-width="8" fill="transparent"/>
                    <circle id="progress-circle" cx="88" cy="88" r="80" stroke="#1C1C1A" stroke-width="8" fill="transparent" stroke-dasharray="502.6" stroke-dashoffset="${offset}" class="transition-all duration-300 ease-linear"/>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="text-4xl font-mono font-bold text-neutral-800 tracking-tight">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</span>
                    <span class="text-[10px] text-neutral-400 uppercase mt-1 tracking-widest">${state.pomodoro.state}</span>
                </div>
            </div>
            <div class="flex justify-center items-center space-x-3">
                <button onclick="toggleTimer()" class="px-5 py-2.5 bg-neutral-800 hover:bg-neutral-900 text-white rounded-xl text-xs font-semibold shadow-sm hover:scale-105 active:scale-95 smooth-transition">${btnLabel}</button>
                <button onclick="resetTimer()" class="p-2.5 bg-neutral-100 hover:bg-neutral-200 text-neutral-600 rounded-xl text-xs smooth-transition"><i class="fa-solid fa-arrow-rotate-left"></i></button>
            </div>
            <div class="pt-4 mt-6 border-t border-neutral-100 flex justify-between gap-1.5">
                <button onclick="setTimerPreset(25,'Focus')" class="flex-1 py-1.5 bg-neutral-50 hover:bg-neutral-100 text-[11px] font-medium rounded-lg text-neutral-600 text-center transition">${t('preset25')}</button>
                <button onclick="setTimerPreset(5,'Short Break')" class="flex-1 py-1.5 bg-neutral-50 hover:bg-neutral-100 text-[11px] font-medium rounded-lg text-neutral-600 text-center transition">${t('preset5')}</button>
                <button onclick="setTimerPreset(15,'Long Break')" class="flex-1 py-1.5 bg-neutral-50 hover:bg-neutral-100 text-[11px] font-medium rounded-lg text-neutral-600 text-center transition">${t('preset15')}</button>
            </div>
        </div>
    </div>`;
}
function toggleTimer() {
    playSound('click');
    if (state.pomodoro.isRunning) {
        clearInterval(timerInterval);
        state.pomodoro.isRunning = false;
        renderCurrentView();
    } else {
        state.pomodoro.isRunning = true;
        renderCurrentView();
        timerInterval = setInterval(() => {
            if (state.pomodoro.remaining > 0) {
                state.pomodoro.remaining--;
                if (state.pomodoro.remaining % 10 === 0) playSound('tick');
                updateTimerDisplay();
            } else {
                clearInterval(timerInterval);
                state.pomodoro.isRunning = false;
                playSound('complete');
                if (state.pomodoro.state === 'Focus') {
                    state.pomodoro.streak++;
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }
                if (state.pomodoro.state === 'Focus') {
                    setTimerPreset(5, 'Short Break');
                } else {
                    setTimerPreset(25, 'Focus');
                }
                saveState();
            }
        }, 1000);
    }
}
function updateTimerDisplay() {
    const mins = Math.floor(state.pomodoro.remaining / 60);
    const secs = state.pomodoro.remaining % 60;
    const totalDur = state.pomodoro.duration * 60;
    const progress = (totalDur - state.pomodoro.remaining) / totalDur;
    const offset = 502.6 * (1 - progress);
    const circle = document.getElementById('progress-circle');
    if (circle) circle.style.strokeDashoffset = offset;
    const display = document.querySelector('.text-4xl.font-mono');
    if (display) display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}
function setTimerPreset(minutes, stateName) {
    playSound('click');
    if (timerInterval) clearInterval(timerInterval);
    state.pomodoro.isRunning = false;
    state.pomodoro.duration = minutes;
    state.pomodoro.remaining = minutes * 60;
    state.pomodoro.state = stateName;
    saveState();
    if (currentMainTab === 0 && currentSubTab === 0) renderCurrentView();
}
function resetTimer() {
    playSound('click');
    if (timerInterval) clearInterval(timerInterval);
    state.pomodoro.isRunning = false;
    state.pomodoro.remaining = state.pomodoro.duration * 60;
    renderCurrentView();
}

function addClipboardWindow() {
    playSound('click');
    const nextId = state.clipboards.length ? Math.max(...state.clipboards.map(b=>b.id))+1 : 1;
    state.clipboards.push({ id: nextId, title: `Board #${nextId}`, content: '', color: boardColors[Math.floor(Math.random()*boardColors.length)] });

}
function updateClipboardTitle(id, val) { const b = state.clipboards.find(x=>x.id===id); if(b){b.title=val; saveState();} }
function updateClipboardContent(id, val) { const b = state.clipboards.find(x=>x.id===id); if(b){b.content=val; saveState();} }
function setClipboardColor(id, c) { playSound('tick'); const b=state.clipboards.find(x=>x.id===id); if(b){b.color=c; saveState(); renderCurrentView();} }
function deleteClipboard(id) { playSound('click'); state.clipboards=state.clipboards.filter(x=>x.id!==id); saveState(); renderCurrentView(); }
function copyClipboardText(id) {
    const b = state.clipboards.find(x=>x.id===id);
    if(b && b.content) {

    }
}

        <div class="p-4 rounded-2xl smooth-transition cursor-pointer flex justify-between items-center group ${bgClass}">
            <div class="flex items-center space-x-3 flex-1" onclick="toggleTimelineActive(${idx})">
                <span class="text-[10px] font-mono tracking-tight ${slot.active?'text-neutral-400':'text-neutral-500'} font-semibold shrink-0">${slot.hour}</span>
                <span class="text-xs text-neutral-300">|</span>
                <input type="text" value="${slot.task.replace(/"/g,'&quot;')}" onchange="updateTimelineTask(${idx},this.value)" onclick="event.stopPropagation()" class="bg-transparent font-medium text-xs border-none focus:outline-none w-full p-0">
            </div>
            <button onclick="removeTimelineSlot(${idx})" class="p-1 text-neutral-400 hover:text-rose-500 transition opacity-0 group-hover:opacity-100"><i class="fa-solid fa-xmark text-xs"></i></button>
        </div>`;
    });
    return `
    <div class="space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-serif font-bold text-neutral-800 tracking-tight">${t('dailyFlow')}</h2>
            <button onclick="clearTimeline()" class="text-xs text-neutral-400 hover:text-rose-500 transition"><i class="fa-regular fa-trash-can mr-1"></i>${t('clearTimeline')}</button>
        </div>
        <div class="bg-white border border-neutral-200/60 rounded-3xl p-6 shadow-premium space-y-3 max-h-[500px] overflow-y-auto">
            ${slots}
            <div onclick="addNewTimelineSlot()" class="p-3 rounded-2xl border border-dashed border-neutral-200 hover:border-neutral-800 flex justify-center items-center cursor-pointer transition text-xs text-neutral-400 hover:text-neutral-800">
                <i class="fa-solid fa-plus mr-1.5"></i>${t('addSlot')}
            </div>
        </div>
    </div>`;
}
function toggleTimelineActive(idx) { playSound('tick'); state.timeline[idx].active=!state.timeline[idx].active; saveState(); renderCurrentView(); }
function updateTimelineTask(idx, val) { state.timeline[idx].task=val; saveState(); }
function addNewTimelineSlot() {
    playSound('click');
    const d=new Date();
    const s=String(d.getHours()).padStart(2,'0')+':00';
    const e=String((d.getHours()+1)%24).padStart(2,'0')+':00';
    state.timeline.push({hour:`${s} - ${e}`,task:'New task',active:false});
    saveState(); renderCurrentView();
}
function removeTimelineSlot(idx) { playSound('click'); state.timeline.splice(idx,1); saveState(); renderCurrentView(); }
function clearTimeline() { playSound('click'); state.timeline=[]; saveState(); renderCurrentView(); }
// ===== INBOX VIEW =====
function renderInboxView() {
    let items = '';
    if (state.inboxItems.length === 0) {
        items = `<div class="text-xs text-neutral-400 italic text-center py-8">${t('emptyInbox')}</div>`;
    } else {
        state.inboxItems.forEach((item, idx) => {
            const badgeClass = item.priority==='high'?'bg-rose-50 text-rose-600':(item.priority==='normal'?'bg-amber-50 text-amber-600':'bg-sky-50 text-sky-600');
            const prioLabel = item.priority==='high'?t('priorityHigh'):(item.priority==='normal'?t('priorityNormal'):t('priorityLow'));
            items += `
            <div class="p-4 rounded-2xl bg-neutral-50/70 border border-neutral-100 flex flex-col space-y-2 smooth-transition ${item.done?'opacity-50':''}">
                <div class="flex justify-between items-start gap-2">
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${badgeClass}">${prioLabel}</span>
                            ${item.link?`<a href="${item.link}" target="_blank" class="text-xs font-semibold text-neutral-800 hover:underline">${item.title} <i class="fa-solid fa-up-right-from-square text-[9px] text-neutral-400"></i></a>`:`<span class="text-xs font-semibold text-neutral-800">${item.title}</span>`}
                        </div>
                        <p class="text-[11px] text-neutral-500">${item.note||''}</p>
                    </div>
                    <div class="flex space-x-1 shrink-0">
                        <button onclick="toggleInboxDone(${idx})" class="p-1.5 ${item.done?'text-emerald-500':'text-neutral-300 hover:text-emerald-500'} transition"><i class="fa-solid fa-check-circle text-sm"></i></button>
                        <button onclick="removeInboxItem(${idx})" class="p-1.5 text-neutral-300 hover:text-rose-500 transition"><i class="fa-regular fa-trash-can text-sm"></i></button>
                    </div>
                </div>
            </div>`;
        });
    }
    return `
    <div class="space-y-6">
        <div>
            <h2 class="text-xl font-serif font-bold text-neutral-800 tracking-tight">${t('inboxTitle')}</h2>
            <p class="text-sm text-neutral-400 mt-1">${t('inboxSub')}</p>
        </div>
        <div class="bg-white border border-neutral-200/60 rounded-3xl p-6 shadow-premium">
            <div class="bg-neutral-50/70 border border-neutral-100 rounded-2xl p-4 mb-6 space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="inbox-title" placeholder="${t('inboxTitleInput')}" class="bg-white px-3 py-2 border border-neutral-200/60 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-neutral-400">
                    <input type="text" id="inbox-link" placeholder="${t('inboxLinkInput')}" class="bg-white px-3 py-2 border border-neutral-200/60 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-neutral-400">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
                    <input type="text" id="inbox-note" placeholder="${t('inboxNoteInput')}" class="md:col-span-2 bg-white px-3 py-2 border border-neutral-200/60 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-neutral-400">
                    <select id="inbox-priority" class="bg-white px-3 py-2 border border-neutral-200/60 rounded-xl text-xs focus:outline-none text-neutral-600">
                        <option value="high">${t('priorityHigh')}</option>
                        <option value="normal" selected>${t('priorityNormal')}</option>
                        <option value="low">${t('priorityLow')}</option>
                    </select>
                </div>
                <button onclick="addInboxItem()" class="w-full py-2 bg-neutral-800 hover:bg-neutral-900 text-white rounded-xl text-xs font-semibold shadow-sm transition">
                    <i class="fa-solid fa-paper-plane mr-1.5"></i>${t('addToInbox')}
                </button>
            </div>
            <div class="space-y-3 max-h-[350px] overflow-y-auto pr-1">${items}</div>
        </div>
    </div>`;
}
function addInboxItem() {
    const title = document.getElementById('inbox-title').value.trim();
    if (!title) return;
    playSound('success');
    state.inboxItems.unshift({
        id: Date.now(), title,
        link: document.getElementById('inbox-link').value.trim(),
        note: document.getElementById('inbox-note').value.trim(),
        priority: document.getElementById('inbox-priority').value,
        done: false
    });
    saveState(); renderCurrentView();
}
function toggleInboxDone(idx) { playSound('success'); state.inboxItems[idx].done=!state.inboxItems[idx].done; saveState(); renderCurrentView(); }
function removeInboxItem(idx) { playSound('click'); state.inboxItems.splice(idx,1); saveState(); renderCurrentView(); }
// ===== KNOWLEDGE PITS VIEW =====
function renderPitsView() {
    let pitsHtml = '';
    if (state.pits.length === 0) {
        pitsHtml = `<div class="text-xs text-neutral-400 italic text-center py-8">${t('noPits')}</div>`;
    } else {
        state.pits.forEach((pit, pitIdx) => {
            const total = pit.milestones.length;
            const completed = pit.milestones.filter(m => m.done).length;
            const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
            let checksHtml = '';
            pit.milestones.forEach((stone, stoneIdx) => {
                checksHtml += `
                <label class="flex items-center space-x-2 text-xs text-neutral-600 select-none cursor-pointer">
                    <input type="checkbox" ${stone.done ? 'checked' : ''} onchange="toggleMilestone(${pitIdx},${stoneIdx})" class="rounded border-neutral-300 text-neutral-800 focus:ring-0">
                    <span class="${stone.done ? 'line-through text-neutral-400' : ''}">${stone.label}</span>
                </label>`;
            });
            pitsHtml += `
            <div class="p-5 rounded-2xl bg-neutral-50/50 border border-neutral-100 space-y-4 shadow-sm">
                <div class="flex justify-between items-start">
                    <div>
                        <h4 class="text-xs font-bold text-neutral-800">${pit.name}</h4>
                        <div class="flex items-center space-x-2 mt-1">
                            <div class="w-24 bg-neutral-200 h-1 rounded-full overflow-hidden"><div class="bg-neutral-800 h-full" style="width:${pct}%"></div></div>
                            <span class="text-[9px] text-neutral-400 font-semibold">${pct}% ${t('achieved')}</span>
                        </div>
                    </div>
                    <button onclick="removePit(${pitIdx})" class="text-neutral-400 hover:text-rose-500 transition text-xs"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-1.5 pl-1">${checksHtml}</div>
                <div class="pt-2 border-t border-dashed border-neutral-200/60 flex items-center space-x-2">
                    <input type="text" id="input-milestone-${pitIdx}" placeholder="${t('pitStepPlaceholder')}" class="bg-white border border-neutral-200/50 px-3 py-1 rounded-lg text-[10px] flex-1 focus:outline-none" onkeydown="if(event.key==='Enter')addMilestone(${pitIdx})">
                    <button onclick="addMilestone(${pitIdx})" class="px-2.5 py-1 bg-neutral-800 text-white rounded-lg text-[10px]">${t('pitAddStep')}</button>
                </div>
            </div>`;
        });
    }
    return `
    <div class="space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-xl font-serif font-bold text-neutral-800 tracking-tight">${t('pitsTitle')}</h2>
                <p class="text-sm text-neutral-400 mt-1">${t('pitsSub')}</p>
            </div>
            <button onclick="showNewPitForm()" class="px-2.5 py-1.5 border border-neutral-200 hover:bg-neutral-50 rounded-xl text-[11px] font-medium text-neutral-600 flex items-center space-x-1">
                <i class="fa-solid fa-compass-drafting text-[10px]"></i><span>${t('newPit')}</span>
            </button>
        </div>
        <div id="new-pit-form" class="hidden bg-neutral-50 border border-neutral-100 rounded-2xl p-4 space-y-3">
            <input type="text" id="pit-name" placeholder="${t('pitNamePlaceholder')}" class="w-full bg-white px-3 py-2 border border-neutral-200/60 rounded-xl text-xs focus:outline-none">
            <input type="text" id="pit-milestones" placeholder="${t('pitMilestonePlaceholder')}" class="w-full bg-white px-3 py-2 border border-neutral-200/60 rounded-xl text-xs focus:outline-none">
            <div class="flex justify-end space-x-2">
                <button onclick="hideNewPitForm()" class="px-3 py-1.5 border border-neutral-200 text-neutral-500 rounded-lg text-xs hover:bg-neutral-100">${t('pitCancel')}</button>
                <button onclick="createKnowledgePit()" class="px-4 py-1.5 bg-neutral-800 hover:bg-neutral-900 text-white rounded-lg text-xs font-semibold">${t('pitCreate')}</button>
            </div>
        </div>
        <div class="space-y-4 max-h-[500px] overflow-y-auto pr-1">${pitsHtml}</div>
    </div>`;
}
function showNewPitForm() { playSound('click'); renderCurrentView(); setTimeout(()=>{const f=document.getElementById('new-pit-form');if(f)f.classList.remove('hidden');},20); }
function hideNewPitForm() { const f=document.getElementById('new-pit-form'); if(f)f.classList.add('hidden'); }
function createKnowledgePit() {
    const name = document.getElementById('pit-name').value.trim();
    if (!name) return;
    playSound('success');
    const milestonesRaw = document.getElementById('pit-milestones').value.trim();
    const milestones = milestonesRaw ? milestonesRaw.split(/[,，]/).filter(s=>s.trim()).map(s=>({label:s.trim(),done:false})) : [];
    state.pits.unshift({ id: Date.now(), name, milestones });
    saveState(); renderCurrentView();
}
function toggleMilestone(pitIdx, stoneIdx) {
    playSound('success');
    state.pits[pitIdx].milestones[stoneIdx].done = !state.pits[pitIdx].milestones[stoneIdx].done;
    const total = state.pits[pitIdx].milestones.length;
    const completed = state.pits[pitIdx].milestones.filter(m=>m.done).length;
    if (total === completed && total > 0) {
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
    }
    saveState(); renderCurrentView();
}
function addMilestone(pitIdx) {
    const input = document.getElementById(`input-milestone-${pitIdx}`);
    const text = input.value.trim();
    if (!text) return;
    playSound('tick');
    state.pits[pitIdx].milestones.push({ label: text, done: false });
    saveState(); renderCurrentView();
}
function removePit(idx) { playSound('click'); state.pits.splice(idx,1); saveState(); renderCurrentView(); }

// ===== GLOBAL INIT =====
window.onload = function() {
    loadState();
    applySidebarState();
    applyLang();
    renderCurrentView();
    // Live clock
    setInterval(() => {
        const now = new Date();
        document.getElementById('live-clock').textContent = now.toTimeString().split(' ')[0];
    }, 1000);
    // Sidebar date & quote
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('sidebar-date').textContent = new Date().toLocaleDateString(currentLang === 'cn' ? 'zh-CN' : 'en-US', opts);
    const quotes = ['"纯粹至美，至简则灵"', '"把灵感交给剪贴板，把心交给专注"', '"少即是多"', '"深沉的知识，始于每一次开坑"'];
    document.getElementById('sidebar-quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];
};

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key >= '1' && e.key <= '4') {
        e.preventDefault(); switchMainTab(parseInt(e.key) - 1);
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
        e.preventDefault(); toggleSidebar();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
        e.preventDefault(); currentMainTab = 1; currentSubTab = 1; updateNavHighlight(); applyLang(); renderCurrentView();
        setTimeout(() => { const el = document.getElementById('log-entry-input'); if(el) el.focus(); }, 80);
    }
});
</script>
</body>
</html>

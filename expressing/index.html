<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expressing | Native Expression Refiner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#059669', // Emerald 600 (Main theme changed to Green for "Correctness")
                        primaryLight: '#ecfdf5', // Emerald 50
                        danger: '#dc2626', // Red 600
                        dangerLight: '#fef2f2', // Red 50
                        secondary: '#64748b', // Slate 500
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Typography Fixes */
        .prose :where(code):not(:where(pre code)) {
            color: #059669;
            background-color: #ecfdf5;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 500;
            border: 1px solid #a7f3d0;
        }
        .prose pre { background-color: #1e293b; border-radius: 0.5rem; }

        /* Highlight Styles */
        .bri-highlight {
            background-color: #ffff00;
            border-bottom: 2px solid #eab308;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0 2px;
        }
        .mode-view .bri-highlight:hover { background-color: #fde047; }
        .mode-view .bri-highlight.active { outline: 2px solid #ca8a04; }
        
        /* Floating Toolbar */
        #selection-toolbar {
            display: none; position: fixed; z-index: 100;
            background: #1e293b; color: white; padding: 8px 16px;
            border-radius: 99px; box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.3);
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            animation: fadeIn 0.15s ease-out; transform: translateX(-50%);
        }
        #selection-toolbar::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px;
            border-width: 6px; border-style: solid; border-color: #1e293b transparent transparent transparent;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

        /* Sidebar Transition */
        #left-sidebar { transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-closed #left-sidebar { margin-left: -18rem; }
    </style>
</head>
<body class="bg-gray-50 h-screen w-screen flex text-slate-800 overflow-hidden" id="app-body">

    <aside id="left-sidebar" class="w-72 bg-white border-r border-gray-200 flex flex-col flex-shrink-0 z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">

        </div>

    <script>
        // --- DATA STRUCTURE & CONFIG ---
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);
        const STORAGE_KEY = 'bri_fix_pro_v1';
        const DEFAULT_CAT = 'General';

        let appState = {
            docs: [],
            activeDocId: null,
            categories: ['General', 'Business', 'Daily Life', 'Academic'], 
            ui: {
                mode: 'view', 
                globalMode: false,
                drawerOpen: false,
                sidebarOpen: true,
                editingAnnotationId: null,
                searchQuery: '',
                searchCategory: '',
                searchTag: ''
            }
        };

        let tempSelection = { text: '', range: null };

        // --- APP INITIALIZATION ---
        function initApp() {
            marked.use({ breaks: true, gfm: true });
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    appState = { ...appState, ...parsed };
                    // Migration check
                    appState.docs.forEach(d => { if(!d.tags) d.tags = []; });
                    appState.ui.mode = 'view';
                    appState.ui.sidebarOpen = true;
                } catch (e) { console.error(e); }
            } else {
                createMockData();
            }

            appState.ui.drawerOpen = false;
            appState.ui.editingAnnotationId = null;
            appState.ui.globalMode = false;
            
            if (appState.docs.length > 0) {
                if (!appState.docs.find(d => d.id === appState.activeDocId)) appState.activeDocId = appState.docs[0].id;
                window.loadDoc(appState.activeDocId);
            } else {
                window.createNewDoc();
            }
            
            window.updateCategoryDropdowns();
            window.updateTagDropdown();
            window.renderDocList();
            window.setMode('view'); 
        }

        window.addEventListener('DOMContentLoaded', initApp);

        function createMockData() {
            const mockDoc = {
                id: generateId(),
                title: 'Expressing Strong Preference',
                category: 'Daily Life',
                tags: ['preference', 'basic'],
                // NEW FIELDS
                chinese: '我非常喜欢这个主意。',
                mistake: 'I very like this idea.',
                native: 'I really like this idea. / I\'m really into this idea.',
                explanation: '### Grammar Point\n\nIn English, we rarely use "very" directly before a verb like "like" or "love". \n\n* **Incorrect**: I very like...\n* **Correct**: I really like... / I like ... very much.\n\n"Into" is a more casual way to say you are interested in something.',
                annotations: [
                    { id: generateId(), text: 'into', note: 'Phrasal verb: To be interested in or enthusiastic about something.'}
                ],
                updatedAt: Date.now()
            };
            appState.docs = [mockDoc];
            window.persistState();
        }

        window.persistState = function() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        // --- SIDEBAR & NAVIGATION ---
        window.toggleSidebar = function() {
            const body = document.getElementById('app-body');
            appState.ui.sidebarOpen = !appState.ui.sidebarOpen;
            if(appState.ui.sidebarOpen) body.classList.remove('sidebar-closed');
            else body.classList.add('sidebar-closed');
        }

        window.updateTagDropdown = function() {
            const allTags = new Set();
            appState.docs.forEach(doc => {
                if(doc.tags) doc.tags.forEach(t => allTags.add(t));
            });
            const sortedTags = Array.from(allTags).sort();
            const select = document.getElementById('sidebar-tags');
            const current = select.value;
            select.innerHTML = '<option value="">All Tags</option>' + 
                sortedTags.map(t => `<option value="${t}">${t}</option>`).join('');
            if(sortedTags.includes(current)) select.value = current;
        }

        window.updateCategoryDropdowns = function() {
            const sidebarSelect = document.getElementById('sidebar-category');
            const editorSelect = document.getElementById('input-category');
            const currentFilter = sidebarSelect.value;
            
            const options = appState.categories.map(c => `<option value="${c}">${c}</option>`).join('');
            
            sidebarSelect.innerHTML = '<option value="">All Categories</option>' + options;
            if (appState.categories.includes(currentFilter)) sidebarSelect.value = currentFilter;

            if(editorSelect) {
                editorSelect.innerHTML = options;
                const doc = appState.docs.find(d => d.id === appState.activeDocId);
                if(doc && appState.categories.includes(doc.category)) editorSelect.value = doc.category;
            }
        }

        // --- CRUD OPERATIONS ---
        window.createNewDoc = function() {
            const newDoc = {
                id: generateId(),
                title: 'New Correction',
                category: 'General',
                tags: [],
                chinese: '',
                mistake: '',
                native: '',
                explanation: '',
                annotations: [],
                updatedAt: Date.now()
            };
            appState.docs.unshift(newDoc);
            if(appState.ui.globalMode) window.exitGlobalView();
            window.loadDoc(newDoc.id);
            window.setMode('edit');
            window.renderDocList();
            window.persistState();
            setTimeout(() => document.getElementById('doc-title-input').select(), 100);
        }

        window.loadDoc = function(id) {
            appState.activeDocId = id;
            const doc = appState.docs.find(d => d.id === id);
            if (!doc) return;
            if (!doc.tags) doc.tags = [];

            // Bind to inputs
            document.getElementById('doc-title-input').value = doc.title;
            document.getElementById('input-chinese').value = doc.chinese || '';
            document.getElementById('input-mistake').value = doc.mistake || '';
            document.getElementById('input-native').value = doc.native || '';
            document.getElementById('input-explanation').value = doc.explanation || '';
            document.getElementById('input-tags').value = doc.tags.join(', ');
            document.getElementById('input-category').value = doc.category;

            window.renderDocList();
            if (appState.ui.mode !== 'edit') {
                window.renderPreview();
                window.renderAnnotationsSidebar();
            }
        }

        window.saveContent = function() {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if (!doc) return;

            doc.chinese = document.getElementById('input-chinese').value;
            doc.mistake = document.getElementById('input-mistake').value;
            doc.native = document.getElementById('input-native').value;
            doc.explanation = document.getElementById('input-explanation').value;
            doc.category = document.getElementById('input-category').value;
            
            const tagsVal = document.getElementById('input-tags').value;
            doc.tags = tagsVal.split(',').map(t => t.trim()).filter(t => t.length > 0);
            
            doc.updatedAt = Date.now();
            window.updateTagDropdown();
            window.renderDocList();
            window.persistState();
        }

        window.updateCurrentDocTitle = function() {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if (doc) {
                doc.title = document.getElementById('doc-title-input').value || "Untitled";
                doc.updatedAt = Date.now();
                window.renderDocList();
                window.persistState();
            }
        }

        window.deleteCurrentDoc = function() {
            if(!confirm("Delete this expression?")) return;
            appState.docs = appState.docs.filter(d => d.id !== appState.activeDocId);
            if(appState.docs.length > 0) window.loadDoc(appState.docs[0].id);
            else window.createNewDoc();
            window.updateTagDropdown();
            window.persistState();
        }

        // --- MODES & VIEW ---
        window.setMode = function(mode) {
            appState.ui.mode = mode;
            // Update Toggle Styles
            ['view', 'note', 'edit'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (mode === m) btn.className = "flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md transition-all bg-white shadow-sm text-gray-900";
                else btn.className = "flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md transition-all text-gray-500 hover:text-gray-900";
            });

            window.closeDrawer();
            document.getElementById('selection-toolbar').style.display = 'none';
            const viewEditor = document.getElementById('view-editor');
            const viewPreview = document.getElementById('view-preview');
            const noteBanner = document.getElementById('note-mode-banner');

            if (mode === 'edit') {
                viewEditor.classList.remove('hidden');
                viewPreview.classList.add('hidden');
                noteBanner.classList.add('hidden');
            } else {
                viewEditor.classList.add('hidden');
                viewPreview.classList.remove('hidden');
                document.getElementById('render-area').className = `space-y-10 ${mode === 'view' ? 'mode-view' : 'mode-note'}`;
                
                if (mode === 'note') {
                    noteBanner.classList.remove('hidden');
                    window.attachSelectionListener();
                } else {
                    noteBanner.classList.add('hidden');
                    const container = document.getElementById('view-preview');
                    container.onmouseup = null;
                    container.onkeyup = null;
                }
                window.saveContent();
                window.renderPreview();
                window.renderAnnotationsSidebar();
            }
        }

        // --- RENDERING & LOGIC ---
        window.getFilteredDocs = function() {
            const { searchQuery, searchCategory, searchTag } = appState.ui;
            return appState.docs.filter(doc => {
                if (searchCategory && doc.category !== searchCategory) return false;
                if (searchTag && (!doc.tags || !doc.tags.includes(searchTag))) return false;
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return doc.title.toLowerCase().includes(q) || 
                       (doc.native || '').toLowerCase().includes(q) ||
                       (doc.chinese || '').includes(q);
            });
        }

        window.renderDocList = function() {
            const list = document.getElementById('doc-list');
            const docs = window.getFilteredDocs();
            if (docs.length === 0) { list.innerHTML = `<div class="text-center text-xs text-gray-400 py-4">No expressions found.</div>`; return; }

            list.innerHTML = docs.map(doc => {
                const isActive = appState.activeDocId === doc.id && !appState.ui.globalMode;
                const tagsHtml = doc.tags && doc.tags.length > 0 
                    ? `<div class="flex flex-wrap gap-1 mt-1">${doc.tags.map(t => `<span class="text-[9px] px-1 bg-gray-100 text-gray-500 rounded border border-gray-200">#${t}</span>`).join('')}</div>` : '';

                return `
                <div onclick="window.loadDoc('${doc.id}')" 
                     class="group p-3 rounded-lg cursor-pointer transition-all border ${isActive ? 'bg-emerald-50 border-emerald-200 shadow-sm' : 'bg-transparent border-transparent hover:bg-gray-50 hover:border-gray-100'}">
                    <div class="flex items-start justify-between mb-1">
                        <div class="font-medium text-sm ${isActive ? 'text-primary' : 'text-gray-700'} truncate flex-1 pr-2">${doc.title}</div>
                    </div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${isActive ? 'bg-white text-primary border border-emerald-100' : 'bg-gray-100 text-gray-500'}">${doc.category}</span>
                        <span class="text-[10px] text-gray-400 ml-auto">${new Date(doc.updatedAt).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span>
                    </div>
                    ${tagsHtml}
                </div>`;
            }).join('');
        }

        window.renderPreview = function() {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if(!doc) return;

            // Metadata Header
            const tagsHtml = doc.tags.map(t => `<span class="text-[10px] text-gray-500 px-1.5 py-0.5 bg-gray-100 rounded">#${t}</span>`).join('');
            document.getElementById('header-meta-info').innerHTML = `
                <span class="px-2 py-0.5 rounded bg-gray-100 text-gray-600 border border-gray-200">${doc.category}</span>
                <div class="flex gap-1">${tagsHtml}</div>
            `;

            // Prepare Content with Highlight Logic
            let nativeHtml = doc.native || '';
            let explanationHtml = marked.parse(doc.explanation || '');

            const wrapText = (html, text, id) => {
                if(!text) return html;
                let pattern = text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                pattern = pattern.replace(/\s+/g, '[\\s\\n]+');
                try {
                    // Match text outside of HTML tags
                    const regex = new RegExp(`(${pattern})(?![^<]*>)`, 'gi');
                    return html.replace(regex, `<span class="bri-highlight" onclick="window.handleAnnotationClick('${id}', event)" data-id="${id}">$1</span>`);
                } catch (e) { return html; }
            };

            // Apply highlights to Native and Explanation
            const sortedAnnos = [...doc.annotations].sort((a,b) => b.text.length - a.text.length);
            sortedAnnos.forEach(anno => {
                nativeHtml = wrapText(nativeHtml, anno.text, anno.id);
                explanationHtml = wrapText(explanationHtml, anno.text, anno.id);
            });

            // Render Layout
            const renderArea = document.getElementById('render-area');
            renderArea.innerHTML = `
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="bg-gray-50 border-b border-gray-200 px-6 py-4">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Target Meaning</div>
                        <div class="text-lg font-medium text-gray-900">${doc.chinese || '<span class="text-gray-300 italic">No Chinese translation provided</span>'}</div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100">
                        <div class="p-6 bg-red-50/10 group hover:bg-red-50/30 transition-colors">
                            <div class="flex items-center gap-2 mb-3">
                                <i class="ph-fill ph-x-circle text-red-500 text-xl"></i>
                                <span class="text-xs font-bold text-red-500 uppercase tracking-wider">Avoid Saying</span>
                            </div>
                            <div class="text-gray-600 font-medium line-through decoration-red-300 decoration-2 decoration-wavy opacity-80 select-text-area">
                                ${doc.mistake || '...'}
                            </div>
                        </div>
                        <div class="p-6 bg-emerald-50/10 group hover:bg-emerald-50/30 transition-colors relative">
                            <div class="flex items-center gap-2 mb-3">
                                <i class="ph-fill ph-check-circle text-emerald-600 text-xl"></i>
                                <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Natural Expression</span>
                            </div>
                            <div class="text-lg font-bold text-gray-800 leading-relaxed select-text-area" id="preview-native-text">
                                ${nativeHtml || '...'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="relative group">
                     <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="ph-fill ph-info"></i> Analysis & Nuance
                    </h2>
                    <div class="prose prose-slate prose-emerald max-w-none text-gray-700 selection:bg-emerald-100 select-text-area">
                        ${explanationHtml}
                    </div>
                </div>
            `;
            if (appState.ui.mode === 'note') window.attachSelectionListener();
        }

        window.renderGlobalGrid = function() {
            const grid = document.getElementById('global-grid');
            const empty = document.getElementById('global-empty');
            const docs = window.getFilteredDocs();

            document.getElementById('global-stats-text').textContent = `${docs.length} expression${docs.length!==1?'s':''} saved`;

            if(docs.length === 0) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            grid.innerHTML = docs.map(doc => {
                const tagsHtml = doc.tags && doc.tags.length > 0 ? `<div class="flex flex-wrap gap-1 mb-3">${doc.tags.slice(0,3).map(t => `<span class="text-[10px] px-1.5 py-0.5 bg-gray-50 text-gray-500 rounded border border-gray-100">#${t}</span>`).join('')}</div>` : '';
                return `
                <div onclick="window.openDocFromGlobal('${doc.id}')" class="bg-white border border-gray-200 rounded-2xl p-5 cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all duration-300 flex flex-col group relative overflow-hidden h-72">
                    <div class="absolute top-0 left-0 w-1 h-full bg-primary opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex justify-between items-start mb-2">
                         <span class="px-2 py-0.5 bg-gray-50 text-gray-600 text-[10px] font-bold rounded uppercase tracking-wider border border-gray-100">${doc.category}</span>
                    </div>
                    ${tagsHtml}
                    <h3 class="font-bold text-gray-800 mb-2 truncate">${doc.title}</h3>
                    
                    <div class="flex-1 space-y-3 mt-1 overflow-hidden">
                        <div class="text-xs text-gray-400 mb-1">Target: ${doc.chinese}</div>
                        <div class="p-2 bg-red-50 rounded text-xs text-red-600 line-through decoration-red-300 truncate opacity-70">
                            ${doc.mistake || '-'}
                        </div>
                        <div class="p-2 bg-emerald-50 rounded text-sm text-emerald-700 font-semibold shadow-sm border border-emerald-100">
                            ${doc.native || '-'}
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
                        <div class="flex items-center gap-1 ${doc.annotations.length > 0 ? 'text-primary font-medium' : ''}">
                            <i class="ph-fill ph-notebook"></i> ${doc.annotations.length} Notes
                        </div>
                        <div class="text-primary opacity-0 group-hover:opacity-100 transition-opacity font-bold">Edit <i class="ph-bold ph-arrow-right"></i></div>
                    </div>
                </div>`;
            }).join('');
        }

        window.openDocFromGlobal = function(id) { window.loadDoc(id); window.exitGlobalView(); }
        window.enterGlobalView = function() {
            appState.ui.globalMode = true;
            document.getElementById('view-global').classList.remove('hidden');
            document.getElementById('view-editor').classList.add('hidden');
            document.getElementById('view-preview').classList.add('hidden');
            document.getElementById('header-doc-controls').classList.add('hidden');
            document.getElementById('doc-mode-toggles').classList.add('hidden');
            document.getElementById('doc-actions').classList.add('hidden');
            document.getElementById('btn-global-view').classList.add('hidden');
            document.getElementById('header-global-title').classList.remove('hidden');
            document.getElementById('header-global-title').classList.add('flex');
            document.getElementById('btn-back-global').classList.remove('hidden');
            window.renderGlobalGrid();
        }
        window.exitGlobalView = function() {
            appState.ui.globalMode = false;
            document.getElementById('view-global').classList.add('hidden');
            if(appState.ui.mode === 'edit') document.getElementById('view-editor').classList.remove('hidden');
            else document.getElementById('view-preview').classList.remove('hidden');
            document.getElementById('header-doc-controls').classList.remove('hidden');
            document.getElementById('doc-mode-toggles').classList.remove('hidden');
            document.getElementById('doc-actions').classList.remove('hidden');
            document.getElementById('btn-global-view').classList.remove('hidden');
            document.getElementById('header-global-title').classList.add('hidden');
            document.getElementById('header-global-title').classList.remove('flex');
            document.getElementById('btn-back-global').classList.add('hidden');
        }

        // --- ANNOTATION LOGIC ---
        window.attachSelectionListener = function() {
            const container = document.getElementById('view-preview');
            const toolbar = document.getElementById('selection-toolbar');
            
            const handleSelect = () => {
                const selection = window.getSelection();
                if (selection.rangeCount === 0) return;
                
                // Ensure selection is within render area
                const renderArea = document.getElementById('render-area');
                if (!renderArea.contains(selection.anchorNode)) return;

                const text = selection.toString().trim();
                if (text.length > 0 && !selection.isCollapsed) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    toolbar.style.top = `${rect.top - 50}px`; 
                    toolbar.style.left = `${rect.left + (rect.width / 2)}px`;
                    toolbar.style.display = 'block';
                    tempSelection.text = text;
                } else {
                    toolbar.style.display = 'none';
                }
            };
            container.onmouseup = handleSelect;
            container.onkeyup = handleSelect; 
        }

        window.initiateAnnotation = function() {
            document.getElementById('selection-toolbar').style.display = 'none';
            appState.ui.editingAnnotationId = null;
            window.openDrawer(true);
        }

        window.handleAnnotationClick = function(id, event) {
            if(event) event.stopPropagation();
            document.querySelectorAll('.bri-highlight').forEach(el => el.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
            
            if (appState.ui.mode === 'view') { 
                window.openDrawer(false); 
                window.scrollToNoteCard(id); 
            } else if (appState.ui.mode === 'note') { 
                window.editAnnotationStart(id); 
            }
        }

        window.saveAnnotation = function() {
            const content = document.getElementById('annotation-input').value;
            if(!content) return;
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if(appState.ui.editingAnnotationId) {
                const idx = doc.annotations.findIndex(a => a.id === appState.ui.editingAnnotationId);
                if(idx !== -1) doc.annotations[idx].note = content;
            } else {
                doc.annotations.push({ id: generateId(), text: tempSelection.text, note: content });
            }
            window.cancelAnnotation();
            window.renderPreview();
            window.renderAnnotationsSidebar();
            window.persistState();
        }

        window.deleteAnnotation = function(id) {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            doc.annotations = doc.annotations.filter(a => a.id !== id);
            window.renderPreview();
            window.renderAnnotationsSidebar();
            window.persistState();
        }

        window.editAnnotationStart = function(id) {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            const anno = doc.annotations.find(a => a.id === id);
            if(!anno) return;
            appState.ui.editingAnnotationId = id;
            tempSelection.text = anno.text;
            document.getElementById('annotation-input').value = anno.note;
            document.getElementById('editor-mode-label').textContent = "Editing Note";
            document.getElementById('save-anno-btn').textContent = "Update";
            window.openDrawer(true);
        }

        window.openDrawer = function(showEditor) {
            const drawer = document.getElementById('annotation-drawer');
            drawer.classList.remove('translate-x-full');
            const panel = document.getElementById('annotation-editor-panel');
            if(showEditor) {
                panel.classList.remove('hidden');
                document.getElementById('selected-text-display').textContent = tempSelection.text;
                document.getElementById('annotation-input').focus();
            } else {
                panel.classList.add('hidden');
            }
        }

        window.closeDrawer = function() {
            document.getElementById('annotation-drawer').classList.add('translate-x-full');
            document.querySelectorAll('.bri-highlight').forEach(el => el.classList.remove('active'));
            window.cancelAnnotation();
        }
        
        window.cancelAnnotation = function() {
            appState.ui.editingAnnotationId = null;
            document.getElementById('annotation-editor-panel').classList.add('hidden');
            document.getElementById('annotation-input').value = '';
            document.getElementById('editor-mode-label').textContent = "Adding Note";
            document.getElementById('save-anno-btn').textContent = "Save";
        }

        window.scrollToNoteCard = function(id) {
            setTimeout(() => {
                const el = document.getElementById(`sidebar-anno-${id}`);
                if(el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('ring-2', 'ring-primary');
                    setTimeout(() => el.classList.remove('ring-2', 'ring-primary'), 1500);
                }
            }, 100);
        }

        window.renderAnnotationsSidebar = function() {
            const list = document.getElementById('annotation-list');
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if(!doc || doc.annotations.length === 0) {
                list.innerHTML = `<div class="text-center mt-12 text-gray-400 italic text-sm">No notes added.</div>`;
                return;
            }
            list.innerHTML = doc.annotations.map(anno => `
            <div id="sidebar-anno-${anno.id}" class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm hover:shadow-md transition-all group">
                <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold text-gray-800 bg-yellow-100 px-2 py-0.5 rounded border border-yellow-200 truncate max-w-[180px]">${anno.text}</span>
                <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="window.editAnnotationStart('${anno.id}')" class="p-1 text-gray-400 hover:text-primary"><i class="ph-bold ph-pencil-simple"></i></button>
                    <button onclick="window.deleteAnnotation('${anno.id}')" class="p-1 text-gray-400 hover:text-red-500"><i class="ph-bold ph-trash"></i></button>
                </div>
                </div>
                <div class="text-sm text-gray-600 leading-relaxed prose prose-sm">${marked.parse(anno.note)}</div>
            </div>`).join('');
        }

        // --- SEARCH, IMPORT, EXPORT ---
        window.handleSearch = function() {
            appState.ui.searchQuery = document.getElementById('sidebar-search').value;
            appState.ui.searchCategory = document.getElementById('sidebar-category').value;
            appState.ui.searchTag = document.getElementById('sidebar-tags').value;
            window.renderDocList();
            if(appState.ui.globalMode) window.renderGlobalGrid();
        }

        window.openCategoryManager = function() {
            document.getElementById('category-modal').classList.remove('hidden');
            document.getElementById('category-manager-list').innerHTML = appState.categories.map(cat => `
                <div class="flex items-center justify-between p-2 hover:bg-gray-50 rounded">
                    <span class="text-sm font-medium">${cat}</span>
                    ${cat !== 'General' ? `<button onclick="window.deleteCategory('${cat}')" class="text-gray-400 hover:text-red-500"><i class="ph-bold ph-trash"></i></button>` : ''}
                </div>
            `).join('');
        }
        window.closeCategoryManager = function() { document.getElementById('category-modal').classList.add('hidden'); }
        window.addCategory = function() {
            const val = document.getElementById('new-cat-input').value.trim();
            if(val && !appState.categories.includes(val)) {
                appState.categories.push(val);
                window.updateCategoryDropdowns();
                window.persistState();
                window.openCategoryManager();
                document.getElementById('new-cat-input').value = '';
            }
        }
        window.deleteCategory = function(cat) {
            if(!confirm("Delete category? Files will move to General.")) return;
            appState.docs.forEach(d => { if(d.category === cat) d.category = 'General'; });
            appState.categories = appState.categories.filter(c => c !== cat);
            window.updateCategoryDropdowns();
            window.persistState();
            window.openCategoryManager();
        }

        window.exportBri = function() {
            const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `bri-fix-backup-${new Date().toISOString().slice(0,10)}.bri`;
            a.click();
        }

        window.triggerImport = function() { document.getElementById('file-input').click(); }
        window.handleFileImport = function(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const loaded = JSON.parse(e.target.result);
                    if(loaded.docs) { appState = loaded; window.initApp(); alert('Import successful'); }
                } catch(err) { alert('Invalid file'); }
            };
            if(input.files[0]) reader.readAsText(input.files[0]);
        }

        window.exportMarkdown = function() {
            const doc = appState.docs.find(d => d.id === appState.activeDocId);
            if (!doc) return;
            
            let md = `# ${doc.title}\n\n`;
            md += `**Context (Chinese):** ${doc.chinese}\n\n`;
            md += `| ❌ Avoid (Mistake) | ✅ Natural (Native) |\n| :--- | :--- |\n| ${doc.mistake.replace(/\n/g, ' ')} | **${doc.native.replace(/\n/g, ' ')}** |\n\n`;
            md += `## Analysis\n\n${doc.explanation}\n\n`;
            
            if(doc.annotations.length > 0) {
                md += `## 📝 Glossary Notes\n\n`;
                doc.annotations.forEach(a => md += `- **${a.text}**: ${a.note}\n`);
            }

            const blob = new Blob([md], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${doc.title.replace(/\s+/g, '_')}.md`;
            a.click();
        }
    </script>
</body>
</html>
